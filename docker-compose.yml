# Local single-node OpenSearch used as a "source" cluster to read the
# recovered PVC data from ./os-data and re-export it cleanly.
#
# Security is disabled so we can hit the API on plain HTTP with no auth.
# auto_import_dangling_indices=true picks up indices that exist on disk
# but aren't in the cluster state yet.
#
# Notes:
# - Image tag matches the version your data was created with (2.3.0).
#   If your data is from a newer minor, bump this; OpenSearch refuses
#   to read indices from a newer version.
# - ./os-data must be owned by UID 1000 (opensearch user). The chown
#   step (alpine throwaway container) handles this.
# - Dashboards is intentionally omitted: we agreed to skip dashboards
#   import for now and migrate indices only.

services:
  opensearch:
    image: opensearchproject/opensearch:2.3.0
    container_name: os-migrate-source
    environment:
      - cluster.name=migrate-source
      - node.name=os-migrate-source
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - gateway.auto_import_dangling_indices=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./os-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
