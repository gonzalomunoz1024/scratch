# GitHub OAuth credentials used by Dev Spaces to:
#   - sign developers in
#   - clone private repos into their workspace pod
#   - issue a short-lived token that `git push` from the in-browser terminal uses
#
# Prerequisites — register a GitHub OAuth App first:
#   https://github.com/settings/developers  → "New OAuth App"
#     Homepage URL:     https://devspaces.<apps.your-cluster-domain>
#     Callback URL:     https://devspaces.<apps.your-cluster-domain>/api/oauth/callback
#   Copy the Client ID and generate a Client Secret.
#
# Then create this secret (NEVER commit the real values — use `oc create secret`
# or a sealed-secret / external-secrets operator). The placeholders below show
# the exact label + annotation set the Dev Spaces operator looks for.
apiVersion: v1
kind: Secret
metadata:
  name: github-oauth-config
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: oauth-scm-configuration
  annotations:
    che.eclipse.org/oauth-scm-server: github
    # Uncomment for GitHub Enterprise Server:
    # che.eclipse.org/scm-server-endpoint: 'https://github.your-company.com'
type: Opaque
stringData:
  id: REPLACE_WITH_GITHUB_OAUTH_CLIENT_ID
  secret: REPLACE_WITH_GITHUB_OAUTH_CLIENT_SECRET
