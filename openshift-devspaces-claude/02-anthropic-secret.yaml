# Anthropic credentials, auto-mounted as environment variables into every
# workspace pod in the developer's user namespace.
#
# The DevWorkspace controller picks this up because of:
#   labels:      controller.devfile.io/mount-to-devworkspace: 'true'
#   annotations: controller.devfile.io/mount-as: env
#
# IMPORTANT: this Secret must live in EACH user's namespace
# (e.g. `<username>-devspaces`). Two ways to handle that:
#   1) Apply it manually per user after their first workspace creation, or
#   2) Use a namespace-scoped GitOps overlay / external-secrets operator
#      to replicate it into every `*-devspaces` namespace.
#
# If you're self-hosting a model on the cluster (vLLM / RHAIIS) and don't need
# api.anthropic.com, set ANTHROPIC_API_KEY to a dummy value here and override
# ANTHROPIC_BASE_URL in the devfile (see 03-devfile.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key
  # namespace: <username>-devspaces   # set per user, or templated via GitOps
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspace-secret
    controller.devfile.io/mount-to-devworkspace: 'true'
    controller.devfile.io/watch-secret: 'true'
  annotations:
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  ANTHROPIC_API_KEY: sk-ant-REPLACE_ME
