# GitOps overlay — replicate ANTHROPIC_API_KEY into every Dev Spaces user
# namespace automatically using External Secrets Operator (ESO).
#
# Prereq: install ESO via OperatorHub ("External Secrets Operator"), or:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace
#
# Flow:
#   1. You manage ONE source Secret in `openshift-devspaces` (commit to git,
#      seal with Sealed Secrets / Vault / SOPS — whatever your GitOps already
#      uses).
#   2. ClusterSecretStore tells ESO how to read from that namespace via the
#      Kubernetes API itself (no external vault required).
#   3. ClusterExternalSecret replicates a derived Secret into every namespace
#      labelled `app.kubernetes.io/component: workspaces-namespace` — which
#      Dev Spaces sets automatically on every `<user>-devspaces` namespace.
#   4. The replicated Secret carries the DevWorkspace controller's mount
#      annotations, so it auto-injects as env vars into every workspace pod.
#
# Result: new developer signs in → Dev Spaces creates their namespace →
# ESO drops the Secret in within seconds → next workspace start has
# ANTHROPIC_API_KEY on the environment with zero manual steps.
---
# ---------------- Source secret (the single source of truth) -----------------
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key-source
  namespace: openshift-devspaces
type: Opaque
stringData:
  ANTHROPIC_API_KEY: sk-ant-REPLACE_ME
---
# ---------------- RBAC for ESO to read the source ----------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-claude-reader
  namespace: openshift-devspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-claude-reader
  namespace: openshift-devspaces
rules:
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames: ['anthropic-api-key-source']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['authorization.k8s.io']
    resources: ['selfsubjectrulesreviews']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-claude-reader
  namespace: openshift-devspaces
subjects:
  - kind: ServiceAccount
    name: eso-claude-reader
    namespace: openshift-devspaces
roleRef:
  kind: Role
  name: eso-claude-reader
  apiGroup: rbac.authorization.k8s.io
---
# ---------------- ClusterSecretStore (kubernetes provider) -------------------
# Tells ESO: "to fetch a secret, read it out of openshift-devspaces using
# this ServiceAccount." No external vault needed.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: claude-secrets-kube
spec:
  provider:
    kubernetes:
      remoteNamespace: openshift-devspaces
      server:
        url: 'https://kubernetes.default.svc'
        caProvider:
          type: ConfigMap
          namespace: openshift-devspaces
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-claude-reader
          namespace: openshift-devspaces
---
# ---------------- ClusterExternalSecret (the actual replicator) --------------
# For every namespace matching the selector, create an ExternalSecret which
# pulls from the ClusterSecretStore above and materialises a real Secret with
# all the DevWorkspace mount labels/annotations baked in.
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: anthropic-api-key
spec:
  externalSecretName: anthropic-api-key
  refreshTime: 1h
  namespaceSelectors:
    - matchLabels:
        # Dev Spaces sets this label on every namespace it provisions for a
        # user (`<user>-devspaces`). Verify on your cluster with:
        #   oc get ns -l app.kubernetes.io/component=workspaces-namespace
        app.kubernetes.io/component: workspaces-namespace
  externalSecretSpec:
    secretStoreRef:
      name: claude-secrets-kube
      kind: ClusterSecretStore
    refreshInterval: 1h
    target:
      name: anthropic-api-key
      creationPolicy: Owner
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: che.eclipse.org
            app.kubernetes.io/component: workspace-secret
            controller.devfile.io/mount-to-devworkspace: 'true'
            controller.devfile.io/watch-secret: 'true'
          annotations:
            controller.devfile.io/mount-as: env
        type: Opaque
    data:
      - secretKey: ANTHROPIC_API_KEY
        remoteRef:
          key: anthropic-api-key-source
          property: ANTHROPIC_API_KEY
