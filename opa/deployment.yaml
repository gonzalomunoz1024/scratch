apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-polling
  labels:
    app: opa-polling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa-polling
  template:
    metadata:
      labels:
        app: opa-polling
      annotations:
        checksum/config: "${CONFIG_HASH}"
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: opa-polling
          image: openpolicyagent/opa:latest-rootless
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "--config-file=/config/config.yaml"
            - "--shutdown-grace-period=5"
            - "--shutdown-wait-period=2"
            - "--log-level=info"
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health?bundles
              port: 8181
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: opa-polling-config
        - name: tmp
          emptyDir: {}
