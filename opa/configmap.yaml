apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-polling-config
  labels:
    app: opa-polling
data:
  config.yaml: |
    services:
      - name: bundle-service
        url: ${SERVICE_URL}
        # Skip TLS verification for the bundle endpoint. The Java service in
        # OpenShift is fronted by a Route whose cert is signed by the cluster
        # ingress CA, which OPA's Go client does not trust by default. To
        # tighten: drop this flag and mount a CA bundle, then set tls.ca_cert.
        allow_insecure_tls: true
    bundles:
      main:
        service: bundle-service
        resource: ${RESOURCE}
        polling:
          min_delay_seconds: ${POLL_MIN}
          max_delay_seconds: ${POLL_MAX}
    decision_logs:
      console: true
    status:
      console: true
