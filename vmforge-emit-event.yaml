apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: vmforge-emit-event
spec:
  description: >
    Emits structured VMForge events to OpenSearch.
    Supports lifecycle events and aggregated per-task completion analytics.
    Best-effort only. Never fails the pipeline.
  params:
    - name: EVENT_KIND
      type: string
      default: TaskCompletion
    - name: TASK_NAME
      type: string
      default: ''
    - name: TASK_STATUS
      type: string
      default: ''
    - name: HELIX_IMAGE_NAME
      type: string
      default: ''
    - name: CORRELATION_ID
      type: string
      default: ''
    - name: NOTIFICATION_LINK
      type: string
      default: ''
    - name: NOTIFICATION_ENTITY_REF
      type: string
      default: 'user:default/unknown'
    - name: IMAGE_URL
      type: string
      default: ''
    - name: IMAGE_OS
      type: string
      default: ''
    - name: SOURCE_GIT_REPO
      type: string
      default: ''
    - name: SOURCE_GIT_BRANCH
      type: string
      default: ''
    - name: USER_PLAYBOOK_URL
      type: string
      default: ''
    - name: USER_PLAYBOOK_BRANCH
      type: string
      default: ''
    - name: USER_PLAYBOOK_FILE
      type: string
      default: ''
    - name: PIPELINE_STATUS
      type: string
      default: 'Unknown'
    - name: TASK_STATUSES
      type: string
      default: ''
    - name: CATALOG_FOLDER
      type: string
      default: helix
    - name: OPENSEARCH_ENDPOINT
      type: string
      default: >-
        https://opensearch-utility-route-claut-203679-primer.apps.dclvnhlsocl9.ocp.np.wellsfargo.net/api/v1/indices/vmforge-events/_doc
  steps:
    - name: emit-event
      image: wfor-proxy-a.wellsfargo.net/docker-redhat-registry-remote/openshift4/ose-cli-rhel9:v4.16
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set +e

        echo "[vmforge-emit-event] Starting event emission"
        echo "[vmforge-emit-event] EVENT_KIND: $(params.EVENT_KIND)"
        echo "[vmforge-emit-event] CORRELATION_ID: $(params.CORRELATION_ID)"
        echo "[vmforge-emit-event] HELIX_IMAGE_NAME: $(params.HELIX_IMAGE_NAME)"
        echo "[vmforge-emit-event] PIPELINE_STATUS: $(params.PIPELINE_STATUS)"
        echo "[vmforge-emit-event] ENDPOINT: $(params.OPENSEARCH_ENDPOINT)"

        WORKSPACE="$(workspaces.source.path)"
        CATALOG_FILE="${WORKSPACE}/$(params.CATALOG_FOLDER)/catalog-info.yaml"
        IMAGESPEC_FILE="${WORKSPACE}/$(params.CATALOG_FOLDER)/vmforge-imagespec.yaml"

        CATALOG_CONTENT=""
        if [ -f "$CATALOG_FILE" ]; then
          CATALOG_CONTENT=$(cat "$CATALOG_FILE")
          echo "[vmforge-emit-event] Loaded catalog-info.yaml"
        else
          echo "[vmforge-emit-event] catalog-info.yaml not found at ${CATALOG_FILE} (may not exist yet at this pipeline stage)"
        fi

        IMAGESPEC_CONTENT=""
        if [ -f "$IMAGESPEC_FILE" ]; then
          IMAGESPEC_CONTENT=$(cat "$IMAGESPEC_FILE")
          echo "[vmforge-emit-event] Loaded vmforge-imagespec.yaml"
        else
          echo "[vmforge-emit-event] vmforge-imagespec.yaml not found at ${IMAGESPEC_FILE} (may not exist yet at this pipeline stage)"
        fi

        CREATOR_RAW=$(awk '/^\s*creator:/ {print $2}' "$IMAGESPEC_FILE" 2>/dev/null || echo "")
        if [ -n "$CREATOR_RAW" ]; then
          ACTOR_USERNAME=$(echo "$CREATOR_RAW" | sed 's|.*/||')
          echo "[vmforge-emit-event] Actor resolved from imagespec: ${ACTOR_USERNAME}"
        else
          ACTOR_USERNAME=$(echo "$(params.NOTIFICATION_ENTITY_REF)" | sed 's|.*/||')
          [ -z "$ACTOR_USERNAME" ] && ACTOR_USERNAME="Triggered By"
          echo "[vmforge-emit-event] Actor resolved from NOTIFICATION_ENTITY_REF: ${ACTOR_USERNAME}"
        fi

        normalize_status() {
          case "$1" in
            Succeeded|Success) echo "Success" ;;
            Failed|Failure) echo "Failure" ;;
            Skipped|None) echo "Skipped" ;;
            *) echo "$1" ;;
          esac
        }

        json_escape() {
          printf '%s' "$1" \
            | sed 's/\\/\\\\/g' \
            | sed 's/"/\\"/g' \
            | sed ':a;N;$!ba;s/\n/\\n/g'
        }

        # -------------------------------------------------------------------
        # TASK ERROR LOG CAPTURE
        # Queries OpenShift for failed TaskRuns in this PipelineRun and
        # captures the last N lines of logs from each failed task's pod.
        # -------------------------------------------------------------------
        declare -A TASK_ERROR_LOGS
        ERROR_LOG_LINES=20

        capture_failed_task_logs() {
          echo "[vmforge-emit-event] Attempting to capture error logs from failed tasks..."

          local PIPELINERUN_NAME="$(params.CORRELATION_ID)"
          local NAMESPACE
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo "")

          if [ -z "$NAMESPACE" ]; then
            echo "[vmforge-emit-event] WARNING: Could not determine namespace, skipping error log capture"
            return
          fi

          if ! command -v oc &> /dev/null; then
            echo "[vmforge-emit-event] WARNING: 'oc' command not found, skipping error log capture"
            return
          fi

          echo "[vmforge-emit-event] Looking for failed TaskRuns in namespace=${NAMESPACE} for pipelineRun=${PIPELINERUN_NAME}"

          # Find all TaskRuns for this PipelineRun that have failed
          local FAILED_TASKRUNS
          FAILED_TASKRUNS=$(oc get taskruns -n "$NAMESPACE" \
            -l "tekton.dev/pipelineRun=${PIPELINERUN_NAME}" \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[0].reason}{"\n"}{end}' 2>/dev/null \
            | grep -i "Failed" \
            | awk '{print $1}')

          if [ -z "$FAILED_TASKRUNS" ]; then
            echo "[vmforge-emit-event] No failed TaskRuns found"
            return
          fi

          echo "[vmforge-emit-event] Found failed TaskRuns: $(echo $FAILED_TASKRUNS | tr '\n' ' ')"

          for TR in $FAILED_TASKRUNS; do
            echo "[vmforge-emit-event] Fetching logs for TaskRun: ${TR}"

            # Get the pod name for this TaskRun
            local POD_NAME
            POD_NAME=$(oc get taskrun "$TR" -n "$NAMESPACE" -o jsonpath='{.status.podName}' 2>/dev/null)

            if [ -z "$POD_NAME" ]; then
              echo "[vmforge-emit-event] WARNING: Could not find pod for TaskRun ${TR}"
              continue
            fi

            # Get the last N lines of logs from the pod (all containers)
            local ERROR_LOG
            ERROR_LOG=$(oc logs "$POD_NAME" -n "$NAMESPACE" --all-containers --tail="$ERROR_LOG_LINES" 2>&1)

            if [ -n "$ERROR_LOG" ]; then
              # Extract just the task name from the TaskRun name (remove pipelinerun prefix)
              local TASK_NAME
              TASK_NAME=$(echo "$TR" | sed "s/${PIPELINERUN_NAME}-//")
              TASK_ERROR_LOGS["$TASK_NAME"]="$ERROR_LOG"
              echo "[vmforge-emit-event] Captured ${ERROR_LOG_LINES} lines of logs for task: ${TASK_NAME}"
            fi
          done

          echo "[vmforge-emit-event] Error log capture complete. Captured logs for ${#TASK_ERROR_LOGS[@]} failed task(s)"
        }

        # Build the error logs JSON object
        build_error_logs_json() {
          local JSON="{"
          local FIRST=true

          for TASK_NAME in "${!TASK_ERROR_LOGS[@]}"; do
            local ESCAPED_LOG
            ESCAPED_LOG=$(json_escape "${TASK_ERROR_LOGS[$TASK_NAME]}")

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              JSON+=","
            fi
            JSON+="\"${TASK_NAME}\": \"${ESCAPED_LOG}\""
          done

          JSON+="}"
          echo "$JSON"
        }
        # -------------------------------------------------------------------

        EMIT() {
          local KIND="$1"
          local RAW_STATUS="$2"
          local EVENT_TYPE="$3"
          local EXEC_START="${4:-}"
          local EXEC_END="${5:-}"
          local OVERRIDE_STATUS_OBJ="${6:-}"
          local ERROR_LOGS_JSON="${7:-{\}}"

          local TS
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "[vmforge-emit-event] Timestamp for ${KIND}: ${TS}"

          local CATALOG_ESCAPED
          CATALOG_ESCAPED=$(json_escape "$CATALOG_CONTENT")
          local IMAGESPEC_ESCAPED
          IMAGESPEC_ESCAPED=$(json_escape "$IMAGESPEC_CONTENT")

          local PHASE
          case "$RAW_STATUS" in
            Succeeded|Success) PHASE="completed" ;;
            Failed|Failure) PHASE="failed" ;;
            Skipped|None) PHASE="skipped" ;;
            *) PHASE="unknown" ;;
          esac

          local STATUS_OBJ
          if [ -n "$OVERRIDE_STATUS_OBJ" ]; then
            STATUS_OBJ="$OVERRIDE_STATUS_OBJ"
          elif [ "$PHASE" = "failed" ]; then
            STATUS_OBJ="{ \"phase\": \"${PHASE}\", \"errors\": [\"Task ${KIND} ended with status: ${RAW_STATUS}\"] }"
          else
            STATUS_OBJ="{ \"phase\": \"${PHASE}\", \"info\": [\"Task ${KIND} ended with status: ${RAW_STATUS}\"] }"
          fi

          local EXEC_BLOCK
          if [ -n "$EXEC_START" ] && [ -n "$EXEC_END" ]; then
            EXEC_BLOCK="{ \"startTime\": \"${EXEC_START}\", \"completionTime\": \"${EXEC_END}\", \"source\": \"taskrun\" }"
          elif [ -n "$EXEC_START" ]; then
            EXEC_BLOCK="{ \"startTime\": \"${EXEC_START}\", \"completionTime\": null, \"source\": \"taskrun\" }"
          else
            EXEC_BLOCK="{ \"startTime\": null, \"completionTime\": null, \"source\": \"emit-time-only\" }"
          fi

          PAYLOAD=$(cat <<EOF
{
  "@timestamp": "${TS}",
  "emitTime": "${TS}",
  "correlationId": "$(params.CORRELATION_ID)",
  "kind": "${KIND}",
  "status": ${STATUS_OBJ},
  "execution": ${EXEC_BLOCK},
  "actor": { "username": "${ACTOR_USERNAME}" },
  "metadata": {
    "schemaVersion": "1.0.0",
    "eventType": "${EVENT_TYPE}",
    "image": {
      "name": "$(params.HELIX_IMAGE_NAME)",
      "url": "$(params.IMAGE_URL)",
      "os": "$(params.IMAGE_OS)"
    },
    "pipeline": {
      "pipelineRunName": "$(params.CORRELATION_ID)",
      "status": "$(params.PIPELINE_STATUS)",
      "notificationLink": "$(params.NOTIFICATION_LINK)",
      "entityRef": "$(params.NOTIFICATION_ENTITY_REF)"
    },
    "inputs": {
      "sourceGitRepo": "$(params.SOURCE_GIT_REPO)",
      "sourceGitBranch": "$(params.SOURCE_GIT_BRANCH)",
      "userPlaybookUrl": "$(params.USER_PLAYBOOK_URL)",
      "userPlaybookBranch": "$(params.USER_PLAYBOOK_BRANCH)",
      "userPlaybookFile": "$(params.USER_PLAYBOOK_FILE)"
    },
    "files": {
      "catalog-info.yaml": "${CATALOG_ESCAPED}",
      "vmforge-imagespec.yaml": "${IMAGESPEC_ESCAPED}"
    },
    "taskErrorLogs": ${ERROR_LOGS_JSON}
  }
}
EOF
)

          echo "[vmforge-emit-event] Emitting event: kind=${KIND} phase=${PHASE} type=${EVENT_TYPE}"
          echo "[vmforge-emit-event] Payload: ${PAYLOAD}"

          RESPONSE_BODY=$(curl -sk \
            -X POST "$(params.OPENSEARCH_ENDPOINT)" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE_BODY" | grep -c '"_HTTP_CODE_"' | sed 's/.*_HTTP_CODE_//' || echo "")
          BODY=$(echo "$RESPONSE_BODY" | grep -v '"_HTTP_CODE_"' || echo "...")

          echo "[vmforge-emit-event] OpenSearch HTTP code: ${HTTP_CODE} for kind=${KIND}"
          echo "[vmforge-emit-event] OpenSearch response body: ${BODY}"
        }

        # -------------------------------------------------------------------
        # Capture error logs from failed tasks BEFORE emitting events
        # -------------------------------------------------------------------
        capture_failed_task_logs
        ERROR_LOGS_JSON=$(build_error_logs_json)
        echo "[vmforge-emit-event] Error logs JSON: ${ERROR_LOGS_JSON}"
        # -------------------------------------------------------------------

        declare -A TASK_START_TIMES
        declare -A TASK_END_TIMES

        if [ -n "$(params.TASK_STATUSES)" ]; then
          echo "[vmforge-emit-event] Emitting per-task status events..."
          while read -r LINE; do
            [ -z "$LINE" ] && continue
            K="${LINE%%=*}"
            V="${LINE#*=}"
            EXEC_S="${TASK_START_TIMES[$K]:-}"
            EXEC_E="${TASK_END_TIMES[$K]:-}"
            EMIT "$K" "$(normalize_status "$V")" "TaskCompletion" "$EXEC_S" "$EXEC_E"
          done <<< "$(params.TASK_STATUSES)"
          echo "[vmforge-emit-event] Per-task events complete"
        fi

        FINAL_KIND="$(params.EVENT_KIND)"
        [ -n "$(params.TASK_NAME)" ] && FINAL_KIND="$(params.TASK_NAME)"

        FINAL_RAW_STATUS="$(params.TASK_STATUS)"
        [ -z "$FINAL_RAW_STATUS" ] && FINAL_RAW_STATUS="$(params.PIPELINE_STATUS)"
        FINAL_STATUS="$(normalize_status "$FINAL_RAW_STATUS")"

        # Build failure summary - task names only, no log capture
        FAILED_TASKS=()
        if [ -n "$(params.TASK_STATUSES)" ]; then
          while read -r LINE; do
            [ -z "$LINE" ] && continue
            K="${LINE%%=*}"
            V="${LINE#*=}"
            if [ "$(normalize_status "$V")" = "Failure" ]; then
              FAILED_TASKS+=("$K")
            fi
          done <<< "$(params.TASK_STATUSES)"
        fi

        FINAL_STATUS_OBJ=""
        if [ "$FINAL_STATUS" = "Failure" ]; then
          ERRORS_JSON="["
          for T in "${FAILED_TASKS[@]}"; do
            ERRORS_JSON+="\"Task '${T}' failed\","
          done
          ERRORS_JSON="${ERRORS_JSON%,}]"
          [ "$ERRORS_JSON" = "[" ] && ERRORS_JSON="[\"Pipeline failed -- no individual task status details available\"]"
          FINAL_STATUS_OBJ="{ \"phase\": \"failed\", \"errors\": ${ERRORS_JSON} }"
        else
          FINAL_STATUS_OBJ="{ \"phase\": \"completed\", \"info\": [\"Pipeline completed with status: ${FINAL_STATUS}\"] }"
        fi

        echo "[vmforge-emit-event] Emitting final lifecycle event: kind=${FINAL_KIND} status=${FINAL_STATUS}"
        echo "[vmforge-emit-event] Failed tasks: ${FAILED_TASKS[*]:-none}"

        # Pass the error logs JSON to the final ImageCreationCompleted event
        EMIT "$FINAL_KIND" "$FINAL_STATUS" "$(params.EVENT_KIND)" "" "" "$FINAL_STATUS_OBJ" "$ERROR_LOGS_JSON"

        echo "[vmforge-emit-event] Done"
        exit 0
  workspaces:
    - name: source
